<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Tạo tài khoản để bắt đầu sử dụng hệ thống quản lý kho.">
    <title>Tạo tài khoản | Quản lý kho</title>
    <link rel="stylesheet" href="../css/DangKi.css">
</head>
<body>
    <main class="register-page">
        <section class="register-card" aria-labelledby="page-title">
            <a class="brand" href="DangNhap.html" aria-label="Quay lại trang đăng nhập">
                <span class="brand-mark" aria-hidden="true">K</span>
                <span class="brand-name">QUẢN LÝ KHO</span>
            </a>

            <div class="form-heading">
                <p class="eyebrow">BẮT ĐẦU NGAY HÔM NAY</p>
                <h1 id="page-title">Tạo tài khoản</h1>
                <p class="subtitle">Đăng ký để quản lý kho hàng của bạn dễ dàng hơn.</p>
            </div>

            <form class="register-form">
                <div class="form-grid">
                    <div class="form-group">
                        <label for="full-name">Họ và tên</label>
                        <input
                            type="text"
                            id="full-name"
                            name="full_name"
                            placeholder="Nguyễn Văn An"
                            autocomplete="name"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="username">Tên đăng nhập</label>
                        <input
                            type="text"
                            id="username"
                            name="username"
                            placeholder="Nhập tên đăng nhập"
                            autocomplete="username"
                            required
                        >
                    </div>

                    <div class="form-group form-group-wide">
                        <label for="email">Email</label>
                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="ban@example.com"
                            autocomplete="email"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="phone">Số điện thoại</label>
                        <input
                            type="tel"
                            id="phone"
                            name="so_dien_thoai"
                            placeholder="Nhập số điện thoại"
                            autocomplete="tel"
                            required
                        >
                    </div>

                    <fieldset class="form-group role-group">
                        <legend>Vai trò</legend>
                        <div class="role-options">
                            <label class="role-option">
                                <input type="radio" name="vai_tro" value="NHAN_VIEN" checked required>
                                <span>Nhân viên</span>
                            </label>
                            <label class="role-option">
                                <input type="radio" name="vai_tro" value="QUAN_LY">
                                <span>Quản lý</span>
                            </label>
                        </div>
                    </fieldset>

                    <div class="form-group">
                        <label for="password">Mật khẩu</label>
                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Ít nhất 8 ký tự"
                            autocomplete="new-password"
                            minlength="8"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="confirm-password">Xác nhận mật khẩu</label>
                        <input
                            type="password"
                            id="confirm-password"
                            name="confirm_password"
                            placeholder="Nhập lại mật khẩu"
                            autocomplete="new-password"
                            minlength="8"
                            required
                        >
                    </div>
                </div>

                <p class="password-hint">Mật khẩu cần có ít nhất 8 ký tự.</p>
                <p class="register-message" role="status" aria-live="polite"></p>

                <button class="register-button" type="submit">Tạo tài khoản</button>
            </form>

            <p class="login-note">Đã có tài khoản? <a href="DangNhap.html">Đăng nhập</a></p>
            <p class="footer-note">Hệ thống quản lý kho hàng</p>
        </section>
    </main>
    <script src="../js/dang-ki.js"></script>
</body>
</html>
