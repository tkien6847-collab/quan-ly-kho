<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập | Quản lý kho</title>
    <link rel="stylesheet" href="../css/styleDN.css">
</head>
<body>
    <main class="login-page">
        <section class="login-card" aria-labelledby="page-title">
            <div class="brand-mark" aria-hidden="true">K</div>
            <h1 id="page-title">QUẢN LÝ KHO</h1>
            <p class="subtitle">Đăng nhập vào hệ thống quản lý kho</p>

            <form class="login-form">
                <div class="form-group">
                    <label for="username">Tên đăng nhập</label>
                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="Nhập tên đăng nhập"
                        autocomplete="username"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password">Mật khẩu</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Nhập mật khẩu"
                        autocomplete="current-password"
                        required
                    >
                </div>

                <p class="login-message" role="status" aria-live="polite"></p>

                <button type="submit" class="login-button">Đăng nhập</button>
            </form>

            <p class="register-note">Chưa có tài khoản? <a href="DangKi.html">Tạo tài khoản</a></p>
            <p class="footer-note">Hệ thống quản lý kho hàng</p>
        </section>
    </main>
    <script src="../js/dang-nhap.js"></script>
</body>
</html>
